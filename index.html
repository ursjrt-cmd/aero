<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aero</title>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #030712; 
        }

        #starfield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(circle at center, #0a1128 0%, #030712 100%);
        }
    </style>
</head>
<body class="antialiased">

    <canvas id="starfield"></canvas>

    <script>
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let stars = [];
        const numStars = 1000;
        const baseSpeed = 0.8; 

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = (Math.random() - 0.5) * width * 2;
                this.y = (Math.random() - 0.5) * height * 2;
                this.z = Math.random() * width;
                this.pz = this.z;
            }

            update() {
                this.z -= baseSpeed + (1 - this.z / width) * 2; 
                if (this.z <= 0) {
                    this.reset();
                    this.z = width;
                }
            }

            draw() {
                const sx = (this.x / this.z) * width + width / 2;
                const sy = (this.y / this.z) * height + height / 2;
                
                const px = (this.x / this.pz) * width + width / 2;
                const py = (this.y / this.pz) * height + height / 2;

                const intensity = (1 - this.z / width);
                const size = intensity * 2.5;

                ctx.beginPath();
                ctx.arc(sx, sy, size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(224, 242, 254, ${intensity})`; 
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(px, py);
                ctx.lineTo(sx, sy);
                ctx.lineWidth = size * 0.5;
                ctx.strokeStyle = `rgba(56, 189, 248, ${intensity * 0.5})`; 
                ctx.stroke();

                this.pz = this.z;
            }
        }

        function initCanvas() {
            stars = Array.from({ length: numStars }, () => new Star());
        }

        function animate() {
            ctx.fillStyle = 'rgba(3, 7, 18, 0.3)'; 
            ctx.fillRect(0, 0, width, height);

            stars.forEach(star => {
                star.update();
                star.draw();
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize();
        initCanvas();
        animate();
    </script>
</body>
</html>
